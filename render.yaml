# Render Blueprint: DevPulse API (docs/dagitim.md). Veritabanı Neon'dadır (Render'ın ücretsiz
# veritabanı 30 günde silindiği için kullanılmaz). Gizli değerler (sync: false) Render panelinde
# geliştirici tarafından girilir; repoya yazılmaz.
services:
  - type: web
    name: devpulse-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # Yalnızca backend değişince yeniden yayınla (mobil ve belge commit'leri tetiklemez).
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL # Neon bağlantı adresi (postgresql://...?sslmode=require)
        sync: false
      - key: JWT_SECRET # Render rastgele üretir
        generateValue: true
      - key: GITHUB_ANDROID_CLIENT_ID
        sync: false
      - key: GITHUB_ANDROID_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY # boş bırakılırsa AI cevapları şablon olur
        sync: false
