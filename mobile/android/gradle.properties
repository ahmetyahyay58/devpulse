# Şablon 8 GB veriyordu; geliştirme makinesinde toplam 7,7 GB bellek var ve emülatör + Docker
# ile birlikte makineyi tıkıyordu (emülatör çöktü). Bu küçük uygulama için 2 GB yeterli.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
