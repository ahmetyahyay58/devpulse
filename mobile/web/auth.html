<!DOCTYPE html>
<meta charset="utf-8">
<title>DevPulse - giriş tamamlandı</title>
<!-- GitHub girişten sonra buraya döner (OAuth callback). Sayfa, adresi (içinde tek
     kullanımlık kod var) açan uygulamaya iletir ve kapanır. Kaynak: flutter_web_auth_2 README. -->
<p>Giriş tamamlandı. Pencere kendiliğinden kapanmazsa kapatabilirsiniz.</p>
<script>
  function postAuthenticationMessage() {
    const message = { 'flutter-web-auth-2': window.location.href };
    if (window.opener) {
      window.opener.postMessage(message, window.location.origin);
      window.close();
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage(message, window.location.origin);
    } else {
      localStorage.setItem('flutter-web-auth-2', window.location.href);
      window.close();
    }
  }
  postAuthenticationMessage();
</script>
