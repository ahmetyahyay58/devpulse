services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse   # yalnızca yerel geliştirme için
      POSTGRES_DB: devpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
